name: Test project with Maven

on:
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    if: github.base_ref == 'dev'
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    - name: Testing
      run: ./mvnw test
